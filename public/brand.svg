<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      "S" monogram built from two open semicircles stacked vertically.
      Heavy rounded stroke gives it a bold, modern look. Uses currentColor
      so it inherits the surrounding text color in light and dark mode.
      The accent square adds a small magenta pop.
    -->
    <symbol id="brand" viewBox="0 0 100 100">
      <!-- Upper curve: opens to the bottom-left -->
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="13"
        stroke-linecap="round"
        d="M 78 28
           A 22 22 0 1 0 50 50"
      />
      <!-- Lower curve: opens to the top-right -->
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="13"
        stroke-linecap="round"
        d="M 22 72
           A 22 22 0 1 0 50 50"
      />
      <!-- Accent square -->
      <rect x="74" y="74" width="14" height="14" rx="3" fill="#F041FF"/>
    </symbol>
  </defs>
</svg>
